[package]
name = "mrkdup"
version = "0.1.0"
edition = "2021"
description = "A terminal markdown editor with a file tree and soft wrap"
license = "MIT"
repository = "https://github.com/ljgrohn/mrkdup"
readme = "README.md"
keywords = ["markdown", "editor", "tui", "terminal"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = "0.9"
ignore = "0.4"
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
